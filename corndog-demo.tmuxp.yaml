session_name: corndog-demo
windows:
  - window_name: demo
    layout: main-horizontal
    shell_command_before :
      - corndog-source      --force --generate-keypair "$DEMO_PATH/corndog-source.key"
      - corndog-destination --force --generate-keypair "$DEMO_PATH/corndog-destination.key"

    panes:
      - corndog-ttp
      - shell_command:
          - until ss -Htln sport = :9705 | grep -q .; do sleep 1; done
          - until ss -Htln sport = :7760 | grep -q .; do sleep 1; done
          - echo Test | corndog-source --source-private-key "$DEMO_PATH/corndog-source.key" --destination-public-key "$DEMO_PATH/corndog-destination.key.pub" --destination-addr localhost:7760 --ttp-addr localhost:9705 

      - shell_command:
          - until ss -Htln sport = :9705 | grep -q .; do sleep 1; done
          - echo Test | corndog-destination --dest-private-key "$DEMO_PATH/corndog-destination.key" --source-public-key "$DEMO_PATH/corndog-source.key.pub" --ttp-addr localhost:9705
